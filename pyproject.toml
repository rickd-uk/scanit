[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scanit-security"
version = "0.2.0"
description = "A read-only Arch Linux workstation security posture auditor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rick D"}]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/rickd-uk/scanit"
Issues = "https://github.com/rickd-uk/scanit/issues"

[project.scripts]
scanit = "scanit.cli:main"

[tool.setuptools.packages.find]
include = ["scanit*"]
